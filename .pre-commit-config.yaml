repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/JacobCoffee/ty-pre-commit
    rev: v0.0.1
    hooks:
      - id: ty
        additional_dependencies:
          - msgspec>=0.19.0
          - httpx>=0.28.0
          - django>=4.2
          - flask>=2.0
          - litestar>=2.0
          - fastapi>=0.115.0
          - starlette>=0.27.0
          - litestar-workflows>=0.1.0
          - sqlspec>=0.1.0
          - jinja2>=3.0
          - falcon>=3.0
          - sanic>=23.0
          - quart>=0.19
          - bottle>=0.12

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.5.21
    hooks:
      - id: uv-lock

ci:
  autoupdate_schedule: weekly
  autofix_commit_msg: "chore(prek): auto-fix"
  autoupdate_commit_msg: "chore(prek): update hooks"
