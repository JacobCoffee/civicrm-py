{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
</div>

{% if error %}
<div class="alert alert-danger">
    <strong>Error:</strong> {{ error }}
</div>
{% endif %}

<div class="card">
    <div class="card-header">
        <h3>{% if is_edit %}Edit Activity{% else %}New Activity{% endif %}</h3>
    </div>
    <div class="card-body">
        <form method="post" action="{% if is_edit %}{{ url_for('activity_edit', activity_id=activity.id) }}{% else %}{{ url_for('activity_create') }}{% endif %}">
            {{ render_csrf(request) }}
            <div class="form-group">
                <label for="subject" class="form-label">Subject</label>
                <input type="text" name="subject" id="subject" class="form-control" required
                       value="{{ activity.subject if activity else '' }}">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="activity_type_id" class="form-label">Activity Type</label>
                    <select name="activity_type_id" id="activity_type_id" class="form-control" required>
                        <option value="1">Meeting</option>
                        <option value="2">Phone Call</option>
                        <option value="3">Email</option>
                        <option value="4">SMS</option>
                        <option value="5">Event Registration</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status_id" class="form-label">Status</label>
                    <select name="status_id" id="status_id" class="form-control" required>
                        <option value="1">Scheduled</option>
                        <option value="2">Completed</option>
                        <option value="3">Cancelled</option>
                        <option value="4">Left Message</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="source_contact_id" class="form-label">Source Contact</label>
                <select name="source_contact_id" id="source_contact_id" class="form-control" required>
                    {% for contact in contacts %}
                    <option value="{{ contact.id }}">{{ contact.display_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="activity_date_time" class="form-label">Date/Time</label>
                <input type="datetime-local" name="activity_date_time" id="activity_date_time" class="form-control"
                       value="{{ activity.activity_date_time if activity else '' }}">
            </div>

            <div class="form-group">
                <label for="details" class="form-label">Details</label>
                <textarea name="details" id="details" class="form-control" rows="4">{{ activity.details if activity else '' }}</textarea>
            </div>

            <div class="d-flex gap-1 mt-2">
                <button type="submit" class="btn btn-primary">
                    {% if is_edit %}Update Activity{% else %}Create Activity{% endif %}
                </button>
                <a href="{{ url_for('activity_list') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
