{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
</div>

{% if error %}
<div class="alert alert-danger">
    <strong>Error:</strong> {{ error }}
</div>
{% endif %}

<div class="card">
    <div class="card-header">
        <h3>{% if is_edit %}Edit Contact{% else %}New Contact{% endif %}</h3>
    </div>
    <div class="card-body">
        <form method="post" action="{% if is_edit %}{{ url_for('contact_edit', contact_id=contact.id) }}{% else %}{{ url_for('contact_create') }}{% endif %}">
            {{ render_csrf(request) }}
            <div class="form-group">
                <label for="contact_type" class="form-label">Contact Type</label>
                <select name="contact_type" id="contact_type" class="form-control" required>
                    <option value="Individual" {% if contact and contact.contact_type == 'Individual' %}selected{% endif %}>Individual</option>
                    <option value="Organization" {% if contact and contact.contact_type == 'Organization' %}selected{% endif %}>Organization</option>
                    <option value="Household" {% if contact and contact.contact_type == 'Household' %}selected{% endif %}>Household</option>
                </select>
            </div>

            <div id="individual-fields">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="first_name" class="form-label">First Name</label>
                        <input type="text" name="first_name" id="first_name" class="form-control"
                               value="{{ contact.first_name if contact else '' }}">
                    </div>
                    <div class="form-group">
                        <label for="last_name" class="form-label">Last Name</label>
                        <input type="text" name="last_name" id="last_name" class="form-control"
                               value="{{ contact.last_name if contact else '' }}">
                    </div>
                </div>
            </div>

            <div id="organization-fields" style="display: none;">
                <div class="form-group">
                    <label for="organization_name" class="form-label">Organization Name</label>
                    <input type="text" name="organization_name" id="organization_name" class="form-control"
                           value="{{ contact.organization_name if contact else '' }}">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" id="email" class="form-control"
                           value="{{ contact|get_attr('email_primary.email', '') if contact else '' }}">
                </div>
                <div class="form-group">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" name="phone" id="phone" class="form-control"
                           value="{{ contact|get_attr('phone_primary.phone', '') if contact else '' }}">
                </div>
            </div>

            <div class="d-flex gap-1 mt-2">
                <button type="submit" class="btn btn-primary">
                    {% if is_edit %}Update Contact{% else %}Create Contact{% endif %}
                </button>
                <a href="{% if is_edit %}{{ url_for('contact_detail', contact_id=contact.id) }}{% else %}{{ url_for('contact_list') }}{% endif %}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const typeSelect = document.getElementById('contact_type');
    const individualFields = document.getElementById('individual-fields');
    const organizationFields = document.getElementById('organization-fields');

    function updateFields() {
        const isOrg = typeSelect.value === 'Organization';
        individualFields.style.display = isOrg ? 'none' : 'block';
        organizationFields.style.display = isOrg ? 'block' : 'none';
    }

    typeSelect.addEventListener('change', updateFields);
    updateFields();
});
</script>
{% endblock %}
