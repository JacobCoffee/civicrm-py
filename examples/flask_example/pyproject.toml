[project]
name = "flask-civicrm-example"
version = "0.1.0"
description = "Flask example app demonstrating civi-py integration"
requires-python = ">=3.11"
dependencies = [
    "civi-py[flask]",
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "flask-debugtoolbar>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This is a standalone example app, not a library
# Include only the main app module
packages = ["."]
only-include = ["app.py"]

[tool.uv]
dev-dependencies = [
    "flask-debugtoolbar>=0.14",
]

[tool.uv.sources]
# Use local civi-py from parent directory for development
civi-py = { path = "../..", editable = true }
