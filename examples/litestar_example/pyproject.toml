[project]
name = "litestar-civicrm-example"
version = "0.1.0"
description = "Litestar example app demonstrating civi-py integration"
requires-python = ">=3.11"
dependencies = [
    "litestar[standard]>=2.0",
    "civi-py[litestar]",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "httpx>=0.27",
]

[tool.uv.sources]
# Use local civi-py from parent directory for development
civi-py = { path = "../..", editable = true }

[tool.litestar]
app = "app:app"
