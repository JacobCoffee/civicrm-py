[project]
name = "fastapi-civicrm-example"
version = "0.1.0"
description = "FastAPI example app demonstrating civi-py integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "civi-py[fastapi]",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "httpx>=0.27",
]

[tool.uv.sources]
# Use local civi-py from parent directory for development
civi-py = { path = "../..", editable = true }
